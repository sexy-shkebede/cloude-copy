<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Claude Chat Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #1a1a1a;
            --bg-surface: #2b2b2b;
            --text-main: #e5e5e5;
            --text-muted: #8e8e8e;
            --accent-orange: #d97757;
            --font-claude-serif: "Tiempos", "Tiempos Text", "Tiempos Fine", Georgia, serif;
            --font-claude-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-claude-sans);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .claude-serif {
            font-family: var(--font-claude-serif);
            font-size: 17px;
            line-height: 1.55;
            color: #d1d1d1;
        }

        .user-bubble {
            background-color: #2b2b2b;
            border-radius: 18px;
            padding: 10px 16px;
            font-size: 15px;
            color: #e5e5e5;
            display: inline-block;
            max-width: 85%;
            word-break: break-word;
        }

        .icon-btn {
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .icon-btn:hover {
            color: #b0b0b0;
        }

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-star {
            animation: spin-slow 20s linear infinite;
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        .chip-btn {
            background-color: #2b2b2b;
            border: 1px solid #363636;
            color: #d1d1d1;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .chip-btn:hover {
            background-color: #333333;
        }
    </style>
</head>
<body class="max-w-md mx-auto w-full border-x border-[#333] relative">

    <!-- Header -->
    <header class="flex items-center justify-between px-4 py-3 shrink-0 z-10 bg-[#1a1a1a]">
        <button class="text-[#8e8e8e] hover:text-[#e5e5e5]">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
        </button>
        
        <div id="header-title" class="text-[14px] text-[#8e8e8e] hidden">
            New chat - Claude
        </div>

        <div class="flex items-center gap-3">
            <button class="bg-[#2b2b2b] hover:bg-[#333] text-[#e5e5e5] text-[12px] font-medium px-2.5 py-1 rounded-full border border-[#383838] transition-colors">
                Free plan · Upgrade
            </button>
            <button class="text-[#8e8e8e] hover:text-[#e5e5e5]">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </button>
        </div>
    </header>

    <!-- CONTAINER 1: Welcome Screen (Initial) -->
    <div id="welcome-screen" class="flex-1 flex flex-col items-center justify-center px-4 pb-20 select-none">
        <!-- Claude Icon & Title -->
        <div class="flex flex-col items-center mb-8">
            <svg class="animate-star mb-3" width="46" height="46" viewBox="0 0 256 257" version="1.1" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid">
                <title>Claude</title>
                <g>
                    <path d="M50.2278481,170.321013 L100.585316,142.063797 L101.427848,139.601013 L100.585316,138.24 L98.1225316,138.24 L89.6972152,137.721519 L60.921519,136.943797 L35.9696203,135.906835 L11.795443,134.610633 L5.70329114,133.31443 L0,125.796456 L0.583291139,122.037468 L5.70329114,118.602532 L13.0268354,119.250633 L29.2293671,120.352405 L53.5331646,122.037468 L71.161519,123.07443 L97.28,125.796456 L101.427848,125.796456 L102.011139,124.111392 L100.585316,123.07443 L99.4835443,122.037468 L74.3372152,104.992405 L47.116962,86.9751899 L32.8587342,76.6055696 L25.1463291,71.3559494 L21.2577215,66.4303797 L19.5726582,55.6718987 L26.5721519,47.9594937 L35.9696203,48.6075949 L38.3675949,49.2556962 L47.8946835,56.5792405 L68.2450633,72.3281013 L94.8172152,91.9007595 L98.7058228,95.1412658 L100.261266,94.0394937 L100.455696,93.2617722 L98.7058228,90.3453165 L84.2531646,64.2268354 L68.8283544,37.6546835 L61.958481,26.636962 L60.1437975,20.0263291 C59.4956962,17.3043038 59.0420253,15.0359494 59.0420253,12.2491139 L67.0136709,1.42582278 L71.4207595,-1.42108547e-14 L82.0496203,1.42582278 L86.521519,5.31443038 L93.1321519,20.4151899 L103.825823,44.2005063 L120.417215,76.5407595 L125.277975,86.1326582 L127.87038,95.0116456 L128.842532,97.7336709 L130.527595,97.7336709 L130.527595,96.1782278 L131.888608,77.9665823 L134.416203,55.6070886 L136.878987,26.8313924 L137.721519,18.7301266 L141.739747,9.00860759 L149.711392,3.75898734 L155.933165,6.74025316 L161.053165,14.0637975 L160.340253,18.7949367 L157.294177,38.5620253 L151.331646,69.5412658 L147.443038,90.2805063 L149.711392,90.2805063 L152.303797,87.6881013 L162.803038,73.7539241 L180.431392,51.718481 L188.208608,42.9691139 L197.282025,33.3124051 L203.114937,28.7108861 L214.132658,28.7108861 L222.233924,40.7655696 L218.604557,53.2091139 L207.262785,67.596962 L197.865316,79.7812658 L184.38481,97.9281013 L175.959494,112.44557 L176.737215,113.612152 L178.746329,113.417722 L209.207089,106.936709 L225.668861,103.955443 L24                 </g>
            </svg>
            <h1 class="font-serif text-3xl text-[#e5e5e5] tracking-tight" style="font-family: var(--font-claude-serif);">Hello, night owl</h1>
        </div>

        <!-- Central Input Box -->
        <div class="w-full bg-[#2b2b2b] rounded-[22px] p-3 flex flex-col justify-between shadow-lg border border-[#383838]">
            <textarea id="welcome-input" rows="2" placeholder="How can I help you today?" class="w-full bg-transparent text-[#e5e5e5] placeholder-[#757575] text-[15px] resize-none focus:outline-none px-1 pt-1"></textarea>
            
            <div class="flex items-center justify-between mt-2">
                <div class="flex items-center gap-1">
                    <button class="w-8 h-8 flex items-center justify-center text-[#e5e5e5] rounded-full hover:bg-[#3d3d3d] transition-colors">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    <button class="flex items-center gap-1.5 text-[#e5e5e5] text-[13px] font-medium hover:bg-[#3d3d3d] px-2 py-1 rounded-lg transition-colors">
                        Sonnet 5 <span class="text-[#8e8e8e] font-normal">Medium</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#8e8e8e]"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                </div>
                
                <div class="flex items-center gap-1 text-[#e5e5e5]">
                    <button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-[#3d3d3d] transition-colors">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path></svg>
                    </button>
                    <button id="send-welcome-btn" onclick="submitMessage()" class="w-8 h-8 flex items-center justify-center rounded-full bg-[#444] text-[#8e8e8e] transition-colors">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Suggestion Chips -->
        <div class="flex flex-wrap justify-center gap-2 mt-4 max-w-sm">
            <button class="chip-btn" onclick="fillPrompt('Write a story')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg> Write
            </button>
            <button class="chip-btn" onclick="fillPrompt('Learn something new')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg> Learn
            </button>
            <button class="chip-btn" onclick="fillPrompt('Write code for')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg> Code
            </button>
            <button class="chip-btn" onclick="fillPrompt('Life stuff')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg> Life stuff
            </button>
            <button class="chip-btn" onclick="fillPrompt('Claude\'s choice')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path></svg> Claude's choice
            </button>
        </div>
    </div>

    <!-- CONTAINER 2: Chat Screen (Hidden Initially) -->
    <div id="chat-screen" class="flex-1 overflow-y-auto px-4 pt-4 pb-[130px] flex flex-col gap-6 hidden">
        <!-- Messages will be injected here -->
    </div>

    <!-- Bottom Input Area for Active Chat (Hidden Initially) -->
    <div id="chat-footer" class="absolute bottom-0 w-full bg-[#1a1a1a] px-4 pb-4 pt-2 hidden">
        <div class="bg-[#2b2b2b] rounded-[22px] min-h-[100px] p-3 flex flex-col justify-between border border-[#383838]">
            <textarea id="chat-input" rows="1" placeholder="Reply to Claude..." class="w-full bg-transparent text-[#e5e5e5] placeholder-[#757575] text-[15px] resize-none focus:outline-none px-1 pt-1"></textarea>
            
            <div class="flex items-center justify-between mt-2">
                <div class="flex items-center gap-2">
                    <button class="w-8 h-8 flex items-center justify-center text-[#e5e5e5] rounded-full hover:bg-[#3d3d3d] transition-colors">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                    <button class="flex items-center gap-1.5 text-[#e5e5e5] text-[13px] font-medium hover:bg-[#3d3d3d] px-2 py-1 rounded-lg transition-colors">
                        Sonnet 5 <span class="text-[#8e8e8e] font-normal">Medium</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#8e8e8e]"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                </div>
                
                <div class="flex items-center gap-2 text-[#e5e5e5]">
                    <button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-[#3d3d3d] transition-colors">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path></svg>
                    </button>
                    <button class="w-8 h-8 flex items-center justify-center rounded-full bg-[#d97757] text-white transition-colors">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="text-center text-[#757575] text-[11px] mt-2">
            Claude is AI and can make mistakes. Please double-check responses.
        </div>
    </div>

    <script>
        const welcomeInput = document.getElementById('welcome-input');
        const sendBtn = document.getElementById('send-welcome-btn');

        welcomeInput.addEventListener('input', () => {
            if (welcomeInput.value.trim().length > 0) {
                sendBtn.style.backgroundColor = '#d97757';
                sendBtn.style.color = '#ffffff';
            } else {
                sendBtn.style.backgroundColor = '#444';
                sendBtn.style.color = '#8e8e8e';
            }
        });

        function fillPrompt(text) {
            welcomeInput.value = text;
            welcomeInput.focus();
            sendBtn.style.backgroundColor = '#d97757';
            sendBtn.style.color = '#ffffff';
        }

        function submitMessage() {
            const text = welcomeInput.value.trim();
            if (!text) return;

            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('chat-footer').classList.remove('hidden');
            document.getElementById('header-title').classList.remove('hidden');

            const chatScreen = document.getElementById('chat-screen');
            chatScreen.innerHTML = `
                <div class="flex flex-col items-end">
                    <div class="user-bubble">${escapeHtml(text)}</div>
                    <div class="flex items-center gap-3 mt-2 text-[#8e8e8e] text-[12px] mr-1">
                        <span>Just now</span>
                        <button class="icon-btn" title="Edit">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        function escapeHtml(string) {
            return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        welcomeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitMessage();
            }
        });
    </script>
</body>
</html>
